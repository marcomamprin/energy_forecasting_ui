<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Mamprin</title>
  <meta name="description" content="Minimal personal website." />

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
      background: #fafafa;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      max-width: 640px;
      width: 100%;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
      margin: 0 0 1rem;
      letter-spacing: -0.06em;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #444;
      margin: 0 0 2rem;
    }

    a {
      color: inherit;
      text-underline-offset: 0.25em;
    }

    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>
  <main>
    <h1>Marco Mamprin</h1>
    <p>
      Minimal website. More soon.
    </p>

    <nav>
      <a href="https://github.com/marco-mamprin">GitHub</a>
      <a href="https://www.linkedin.com/">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
